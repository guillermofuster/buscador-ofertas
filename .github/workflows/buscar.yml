name: Buscar ofertas

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Buscar
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python buscador.py
      - name: Guardar resultados
        run: |
          git config user.name "buscador-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos OFERTAS.md
          git diff --cached --quiet || git commit -m "Ofertas $(date -u +%F)"
          git push
