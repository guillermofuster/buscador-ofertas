# Configuración del buscador. Edita esto sin tocar el código.

# Términos que se buscan en cada fuente
busquedas:
  - "3D artist"
  - "prop artist"
  - "environment artist"
  - "hard surface artist"
  - "vehicle artist"
  - "3D generalist"
  - "junior 3D artist"

# Antigüedad máxima de las ofertas (días)
dias_max: 21

# JobSpy (LinkedIn, Indeed, Glassdoor). country = país de Indeed/Glassdoor.
jobspy:
  sitios: ["linkedin", "indeed"]
  resultados_por_busqueda: 25
  ubicaciones:
    - {location: "Poland", country: "poland"}
    - {location: "Spain", country: "spain"}
    - {location: "Germany", country: "germany"}
    - {location: "Netherlands", country: "netherlands"}
    - {location: "Sweden", country: "sweden"}
    - {location: "European Union", country: "spain", remoto: true}
    # country = país de Indeed; "worldwide" ya no es válido en JobSpy

# Adzuna: códigos de país (https://developer.adzuna.com)
adzuna:
  paises: ["pl", "es", "de", "nl", "fr", "it", "at", "be"]

# Portales de empleo de videojuegos (true = se buscan, false = no)
# ArtStation, Hitmarker y XPGameJobs no se pueden leer desde un servidor (bloqueo o páginas hechas con JavaScript).
portales:
  remotegamejobs: true
  stratos: true
  gamejobs_co: true
  gamesindustry: true
  grackle: true

# Jooble: ubicaciones de texto libre
jooble:
  ubicaciones: ["Poland", "Spain", "Germany", "Netherlands"]

filtros:
  # El título debe contener al menos una de estas expresiones (sin mayúsculas)
  titulo_incluye:
    - "3d artist"
    - "3d art"
    - "prop artist"
    - "props artist"
    - "environment artist"
    - "hard surface"
    - "hard-surface"
    - "vehicle artist"
    - "weapon artist"
    - "3d generalist"
    - "3d modeler"
    - "3d modeller"
    - "game artist"
    - "level artist"
    - "asset artist"
    - "texture artist"
    - "artysta 3d"
    - "grafik 3d"
    - "artista 3d"
  # Si el título contiene algo de esto, se descarta
  titulo_excluye:
    - "senior"
    - "sr."
    - "sr "
    - "lead"
    - "principal"
    - "director"
    - "head of"
    - "manager"
    - "staff"
    - "expert"
    - "animator"
    - "animation"
    - "technical artist"
    - "concept"
    - "2d"
    - "ui"
    - "ux"
    - "vfx"
    - "character"
    - "lighting"
    - "rigger"
    - "unpaid"
    - "internship"
  # Si la descripción o la empresa contiene algo de esto, se descarta
  sector_excluye:
    - "casino"
    - "igaming"
    - "i-gaming"
    - "slot game"
    - "slots"
    - "gambling"
    - "betting"
    - "architectur"
    - "archviz"
    - "furniture"
    - "real estate"
    - "interior design"
    - "advertising agency"
    - "rev-share"
    - "revenue share"
    - "unpaid"
  # Si la ubicación contiene algo de esto, se descarta (no puede trabajar ahí sin visado)
  lugares_excluye:
    - "united states"
    - "usa"
    - "canada"
    - "quebec"
    - "ontario"
    - "british columbia"
    - "montreal"
    - "montréal"
    - "toronto"
    - "vancouver"
    - "united kingdom"
    - "england"
    - "london"
    - "china"
    - "japan"
    - "korea"
    - "singapore"
    - "malaysia"
    - "kuala lumpur"
    - "india"
    - "vietnam"
    - "philippines"
    - "indonesia"
    - "australia"
    - "brazil"
    - "mexico"
    - "argentina"
    - "colombia"
    - "chile"
  # Descarta si pide este número de años o más
  anios_max: 4
  # Si la descripción pide alguno de estos idiomas, baja el encaje
  idiomas_penalizan: ["polish", "polski", "german", "deutsch", "french", "français"]

# Estudios que ya tienes en tu lista de seguimiento.
